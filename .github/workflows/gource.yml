name: Gource visualization

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: gource-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gource:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gource Action
        uses: nbprojekt/gource-action@57256d303c5a9a5e72ed92ba13e3e83c5ec8b257 # v1.3.0
        with:
          gource_title: "${{ github.event.repository.name }}"
          gource_fps: 30
          gource_auto_skip_seconds: 0.1
          gource_max_file_lag: 0.1
          gource_stop_at_end: true
          gource_output_framerate: 25
          gource_multi_sampling: true
          gource_hide: mouse,progress

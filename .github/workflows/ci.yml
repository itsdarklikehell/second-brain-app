name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci:
    uses: itsdarklikehell/ci-templates/.github/workflows/ci-node.yml@v1.0.0
    with:
      node-version: "20"
      package-manager: auto
      working-directory: .
